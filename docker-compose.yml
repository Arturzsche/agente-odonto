# Evolution API v2 (WhatsApp) + PostgreSQL + Redis para o agente da Clínica Sorriso Ideal.
#
# O agente Node (npm start) roda FORA do Docker, na sua máquina. A Evolution entrega os
# webhooks para ele via host.docker.internal.
#
# As variáveis ${...} vêm do arquivo .env na mesma pasta (o Docker Compose lê sozinho).
# Só as variáveis citadas aqui entram nos containers; a OPENAI_API_KEY não é repassada.
#
# Subir:   docker compose up -d
# Logs:    docker compose logs -f evolution-api
# Parar:   docker compose down        (os dados e a sessão do WhatsApp ficam nos volumes)

name: agente-odonto

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Só acessível pela própria máquina (não expõe a API na rede local).
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Já existe no Docker Desktop; necessário no Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      # --- Servidor ---
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      TELEMETRY_ENABLED: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO,LOG,WEBHOOKS
      LOG_BAILEYS: error
      LOG_COLOR: "true"

      # --- Autenticação (header "apikey" usado pelo agente) ---
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # --- Banco (obrigatório na v2) ---
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD no .env}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Necessário: o download de áudio (getBase64FromMediaMessage) busca a mensagem no banco.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      # Desligados para economizar disco/CPU (o histórico da conversa fica no SQLite do agente).
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # --- Cache ---
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # --- Webhook global: toda instância envia as mensagens recebidas para o agente ---
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:${PORT:-3000}/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # Apenas o evento que o agente usa (os demais ficam desligados por padrão).
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_REQUEST_TIMEOUT_MS: 30000
      WEBHOOK_RETRY_MAX_ATTEMPTS: 3

      # --- Sessão do WhatsApp ---
      CONFIG_SESSION_PHONE_CLIENT: Clinica Sorriso Ideal
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD no .env}
    ports:
      # Exposto só para a própria máquina: o agente (Prisma) conecta por 127.0.0.1:5432.
      # Se já existir um PostgreSQL instalado no Windows na 5432, use POSTGRES_HOST_PORT=5433 no .env.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
