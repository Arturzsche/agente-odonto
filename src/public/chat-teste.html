<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat de Teste</title>
<style>
  :root {
    --header: #008069;
    --header-text: #fff;
    --bg: #efeae2;
    --panel: #f0f2f5;
    --bubble-in: #ffffff;
    --bubble-out: #d9fdd3;
    --text: #111b21;
    --muted: #667781;
    --input: #ffffff;
    --accent: #00a884;
    --notice: #fff3c4;
    --pattern: rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --header: #202c33;
      --header-text: #e9edef;
      --bg: #0b141a;
      --panel: #202c33;
      --bubble-in: #202c33;
      --bubble-out: #005c4b;
      --text: #e9edef;
      --muted: #8696a0;
      --input: #2a3942;
      --notice: #182229;
      --pattern: rgba(255, 255, 255, 0.025);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--panel);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 24px rgba(0, 0, 0, .15);
  }
  header {
    background: var(--header);
    color: var(--header-text);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #25d366; display: grid; place-items: center;
    font-size: 20px; flex: none;
  }
  .contact { flex: 1; min-width: 0; }
  .contact strong { display: block; font-size: 16px; font-weight: 500; }
  .contact span { font-size: 13px; opacity: .8; }
  header button {
    background: transparent; border: 1px solid currentColor; color: inherit;
    border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; opacity: .9;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    background-color: var(--bg);
    background-image: radial-gradient(var(--pattern) 1px, transparent 1px);
    background-size: 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .notice {
    align-self: center;
    background: var(--notice);
    color: var(--muted);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 8px;
    margin: 6px 0;
    text-align: center;
    max-width: 90%;
  }
  .msg {
    max-width: 80%;
    padding: 6px 8px 4px 9px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 1px .5px rgba(0, 0, 0, .13);
  }
  .msg.in { align-self: flex-start; background: var(--bubble-in); border-top-left-radius: 0; }
  .msg.out { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 0; }
  .msg.error { border: 1px solid #e55; }
  .meta { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tick { color: #53bdeb; margin-left: 3px; }
  .msg audio { width: 220px; max-width: 100%; display: block; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  footer {
    background: var(--panel);
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #text {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 15px;
    background: var(--input);
    color: var(--text);
    outline: none;
  }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  .round:disabled { opacity: .5; cursor: default; }
  .round.recording { background: #e53935; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🦷</div>
    <div class="contact">
      <strong>Clínica Sorriso Ideal</strong>
      <span id="status">online</span>
    </div>
    <button id="reset" title="Começa uma conversa com um número novo (histórico limpo)">Nova conversa</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <input id="text" type="text" placeholder="Mensagem" autocomplete="off" autofocus>
    <button id="mic" class="round" title="Gravar áudio (clique para iniciar/parar)">🎤</button>
    <button id="send" class="round" title="Enviar" hidden>➤</button>
  </footer>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const statusEl = document.getElementById('status');

  const STORAGE_KEY = 'chat-teste-phone';
  const randomPhone = () => '5511' + String(Math.floor(900000000 + Math.random() * 99999999));

  let phone;
  try { phone = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage indisponível */ }
  if (!phone) setPhone(randomPhone());

  function setPhone(value) {
    phone = value;
    try { localStorage.setItem(STORAGE_KEY, value); } catch (e) { /* ignora */ }
  }

  const time = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Formatação do WhatsApp: *negrito*, _itálico_, ~tachado~
  function formatWhatsApp(text) {
    return escapeHtml(text)
      .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
      .replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>')
      .replace(/~([^~\n]+)~/g, '<s>$1</s>');
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addNotice(text) {
    const el = document.createElement('div');
    el.className = 'notice';
    el.textContent = text;
    chat.appendChild(el);
    scrollDown();
  }

  function addBubble(side, html, extraClass = '') {
    const el = document.createElement('div');
    el.className = `msg ${side} ${extraClass}`.trim();
    const tick = side === 'out' ? '<span class="tick">✓✓</span>' : '';
    el.innerHTML = `${html}<span class="meta">${time()}${tick}</span>`;
    chat.appendChild(el);
    scrollDown();
    return el;
  }

  function showTyping() {
    statusEl.textContent = 'digitando...';
    const el = document.createElement('div');
    el.className = 'msg in';
    el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    chat.appendChild(el);
    scrollDown();
    return () => { el.remove(); statusEl.textContent = 'online'; };
  }

  /** Monta um payload idêntico ao que a Evolution API envia no evento messages.upsert. */
  function buildPayload(message, messageType) {
    return {
      event: 'messages.upsert',
      instance: 'chat-teste',
      data: {
        key: {
          remoteJid: `${phone}@s.whatsapp.net`,
          fromMe: false,
          id: 'WEB-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        },
        pushName: 'Paciente (chat-teste)',
        messageType,
        message,
      },
    };
  }

  async function postToWebhook(payload) {
    const hideTyping = showTyping();
    setBusy(true);
    try {
      const res = await fetch('webhook?sync=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      hideTyping();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (data.reply) addBubble('in', formatWhatsApp(data.reply));
      else addNotice('O servidor não retornou resposta (mensagem ignorada ou duplicada).');
    } catch (err) {
      hideTyping();
      addBubble('in', escapeHtml('⚠️ Falha ao falar com o servidor: ' + err.message), 'error');
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    micBtn.disabled = busy;
  }

  function sendText() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    toggleButtons();
    addBubble('out', formatWhatsApp(text));
    postToWebhook(buildPayload({ conversation: text }, 'conversation'));
  }

  function toggleButtons() {
    const hasText = input.value.trim().length > 0;
    sendBtn.hidden = !hasText;
    micBtn.hidden = hasText;
  }

  // ---- Áudio (PTT) -------------------------------------------------------
  let recorder = null;
  let chunks = [];

  async function toggleRecording() {
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      addNotice('Este navegador não permite gravar áudio aqui (exige HTTPS ou localhost).');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        micBtn.classList.remove('recording');
        statusEl.textContent = 'online';
        const mimetype = recorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimetype });
        if (blob.size < 1000) return addNotice('Áudio muito curto, tente de novo.');

        addBubble('out', `<audio controls src="${URL.createObjectURL(blob)}"></audio>`);
        const base64 = await blobToBase64(blob);
        postToWebhook(buildPayload({ audioMessage: { mimetype, ptt: true }, base64 }, 'audioMessage'));
      };
      recorder.start();
      micBtn.classList.add('recording');
      statusEl.textContent = 'gravando áudio... clique para enviar';
    } catch (err) {
      addNotice('Não foi possível acessar o microfone: ' + err.message);
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // ---- Eventos ----------------------------------------------------------
  input.addEventListener('input', toggleButtons);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });
  sendBtn.addEventListener('click', sendText);
  micBtn.addEventListener('click', toggleRecording);
  document.getElementById('reset').addEventListener('click', () => {
    setPhone(randomPhone());
    chat.innerHTML = '';
    addNotice(`Nova conversa iniciada como +${phone} (histórico limpo).`);
  });

  addNotice(`Ambiente de teste — você é o paciente +${phone}. As mensagens passam pelo mesmo POST /webhook usado pela Evolution API.`);
</script>
</body>
</html>
